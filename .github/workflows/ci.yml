name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Swift 6.4 ships with Xcode 27 (`xcode-27` runner image, see actions/runner-images#14404).
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

jobs:
  package:
    name: Package tests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: swift test
        run: swift test

  example:
    name: Example app (macOS tests + iOS Simulator build)
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Examples/SwiftBeansExample
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Test on macOS
        run: >
          xcodebuild test
          -project SwiftBeansExample.xcodeproj
          -scheme SwiftBeansExample
          -destination 'platform=macOS'
          -skipPackagePluginValidation
          -skipMacroValidation
      - name: Build for iOS Simulator
        run: >
          xcodebuild build
          -project SwiftBeansExample.xcodeproj
          -scheme SwiftBeansExample
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation
          -skipMacroValidation
